options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: us-central1
  _REPOSITORY: parqcel
  _JOB: parqcel-worker
  _IMAGE_TAG: latest

steps:
  - name: gcr.io/cloud-builders/docker
    id: Build worker image
    args:
      - build
      - -f
      - deploy/gcp/docker/Dockerfile.worker
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/parqcel-worker:${_IMAGE_TAG}
      - .

  - name: gcr.io/cloud-builders/docker
    id: Push worker image
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/parqcel-worker:${_IMAGE_TAG}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: Upsert worker Cloud Run Job
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/parqcel-worker:${_IMAGE_TAG}"

        if gcloud run jobs describe "${_JOB}" --region="${_REGION}" >/dev/null 2>&1; then
          gcloud run jobs update "${_JOB}" \
            --region="${_REGION}" \
            --image="${IMAGE}" \
            --cpu=2 \
            --memory=4Gi \
            --max-retries=1 \
            --task-timeout=3600s
        else
          gcloud run jobs create "${_JOB}" \
            --region="${_REGION}" \
            --image="${IMAGE}" \
            --cpu=2 \
            --memory=4Gi \
            --max-retries=1 \
            --task-timeout=3600s
        fi

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/parqcel-worker:${_IMAGE_TAG}
